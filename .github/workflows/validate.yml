name: §-LANG Publication and Structural Validation

on:
  push:
    paths:
      - "**.lang"
      - "**.md"
      - "CLAIMS.yaml"
      - "tools/publication_gate.py"
      - "tools/validate_typecast.py"
      - "tools/verify_chomsky.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "**.lang"
      - "**.md"
      - "CLAIMS.yaml"
      - "tools/publication_gate.py"
      - "tools/validate_typecast.py"
      - "tools/verify_chomsky.py"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Publication integrity and bounded structural checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run publication integrity gate
        run: python3 tools/publication_gate.py

      - name: Run legacy structural validation
        run: python3 tools/validate_typecast.py --all

      - name: Run Chomsky hierarchy evidence checks
        run: python3 tools/verify_chomsky.py

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            research/publication_gate.json
            research/validation_report_all.json
            research/validation_report_all.md
            research/validation_report.json
            research/validation_report.md
            research/chomsky_verification_report.json
            research/chomsky_verification_report.md
