<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>§-LANG | n-Cosmos AAA Visibility</title>
    <style>
        body { margin: 0; background-color: #050505; color: #0f0; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        canvas { display: block; }
        
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 15, 0, 0.9); padding: 20px;
            border: 1px solid #0f0; border-radius: 2px;
            pointer-events: auto; text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            width: 300px; z-index: 100;
        }

        #chat-ui {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0, 15, 0, 0.9); padding: 20px;
            border: 1px solid #0f0; border-radius: 2px;
            width: 400px; height: 300px; display: flex; flex-direction: column;
            z-index: 100;
        }

        #chat-history { flex-grow: 1; overflow-y: auto; font-size: 12px; margin-bottom: 10px; padding: 5px; border: 1px solid #050; }
        #chat-input-container { display: flex; gap: 5px; }
        #chat-input { flex-grow: 1; background: #000; border: 1px solid #0f0; color: #0f0; padding: 5px; }
        #chat-send { background: #0f0; color: #000; border: none; padding: 5px 15px; cursor: pointer; font-weight: bold; }

        h1 { font-size: 1.1em; margin: 0 0 15px 0; letter-spacing: 2px; color: #fff; border-bottom: 1px solid #0f0; padding-bottom: 5px; }
        .stat { margin: 8px 0; font-size: 0.8em; display: flex; justify-content: space-between; }
        .val { color: #fff; }
        
        .control-group { margin-top: 15px; border-top: 1px solid #050; padding-top: 10px; }
        .control-group label { font-size: 0.7em; display: block; margin-bottom: 5px; }
        select, input[type="range"] { width: 100%; background: #000; color: #0f0; border: 1px solid #050; margin-bottom: 10px; }

        .btn { 
            background: #030; color: #0f0; border: 1px solid #0f0; padding: 5px; 
            font-size: 10px; cursor: pointer; text-align: center; margin-top: 5px;
            transition: all 0.2s;
        }
        .btn:hover { background: #0f0; color: #000; }

        /* Slang Graphics Overlay */
        #holo-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 255, 0, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 50px 50px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="holo-grid"></div>

    <div id="ui">
        <h1>n-Cosmos | Substrate</h1>
        <div class="stat"><span>State</span> <span class="val" id="status-val">STABLE_FIXPOINT</span></div>
        <div class="stat"><span>Hamiltonian</span> <span class="val" id="energy-val">1.00000</span></div>
        <div class="stat"><span>Poincaré Norm</span> <span class="val" id="norm-val">0.00000</span></div>
        
        <div class="control-group">
            <label>Visual Mode</label>
            <select id="mode-select">
                <option value="default">3D Sectional Tower</option>
                <option value="sectional">2D Poincaré Projections</option>
                <option value="matrix">Holographic Matrix</option>
            </select>

            <label>Flow Speed (dt)</label>
            <input type="range" id="speed-slider" min="0" max="0.05" step="0.001" value="0.01">

            <div class="btn" id="rho-btn">Apply Möbius ρ</div>
            <div class="btn" id="reset-btn">Reset Fixpoint</div>
        </div>
    </div>

    <div id="chat-ui">
        <div id="chat-history">--- UTAI NLP ACTIVE ---</div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Query the Topos..." autocomplete="off">
            <button id="chat-send">GO</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        camera.position.set(1.5, 1.5, 1.5);
        controls.update();

        // --- Poincaré Boundary: §-LANG Geometric Style ---
        const sphereGeom = new THREE.SphereGeometry(1, 64, 32);
        const sphereMat = new THREE.MeshBasicMaterial({
            color: 0x00ff00,
            wireframe: true,
            transparent: true,
            opacity: 0.05,
        });
        const poincare = new THREE.Mesh(sphereGeom, sphereMat);
        scene.add(poincare);

        // Circular rings for sectional levels
        for(let i = -2; i <= 2; i++) {
            const ringGeom = new THREE.RingGeometry(0.99, 1, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x004400, side: THREE.DoubleSide });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = i * 0.4;
            scene.add(ring);
        }

        // --- Sectional Nodes ---
        const nodes = [];
        const createNode = (pos, color, label) => {
            const group = new THREE.Group();
            
            // Core node
            const geom = new THREE.SphereGeometry(0.04, 16, 16);
            const mat = new THREE.MeshStandardMaterial({ 
                color: color, 
                emissive: color, 
                emissiveIntensity: 1 
            });
            const mesh = new THREE.Mesh(geom, mat);
            group.add(mesh);

            // Orbiting ring (Slang Graphic)
            const torusGeom = new THREE.TorusGeometry(0.08, 0.005, 8, 32);
            const torusMat = new THREE.MeshBasicMaterial({ color: color });
            const torus = new THREE.Mesh(torusGeom, torusMat);
            torus.rotation.x = Math.PI/2;
            group.add(torus);

            group.position.set(...pos);
            scene.add(group);
            nodes.push({ group, torus, label, originalPos: new THREE.Vector3(...pos) });
            return group;
        };

        const nodeColors = [0x00ffff, 0xff00ff, 0xffff00, 0x00ff88];
        const n1 = createNode([0.5, 0.2, 0.1], nodeColors[0], "Z/k_Sheaf");
        const n2 = createNode([-0.3, 0.4, 0.6], nodeColors[1], "U(1)_Phase");
        const n3 = createNode([0.2, -0.5, -0.3], nodeColors[2], "Hamiltonian_Fix");

        // Tendrils (Sheaf Connections)
        const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.3 });
        const lineGeom = new THREE.BufferGeometry();
        const line = new THREE.Line(lineGeom, lineMat);
        scene.add(line);

        // --- Animation & Flow ---
        let time = 0;
        let flowSpeed = 0.01;
        let mode = 'default';

        function animate() {
            requestAnimationFrame(animate);
            time += flowSpeed;

            // UI Update
            document.getElementById('energy-val').innerText = (1.0 + Math.sin(time*10)*0.0001).toFixed(5);
            document.getElementById('norm-val').innerText = nodes[0].group.position.length().toFixed(5);

            nodes.forEach((node, i) => {
                const angle = time + (i * Math.PI * 2 / nodes.length);
                const r = node.originalPos.length();
                
                if (mode === 'default' || mode === 'sectional') {
                    node.group.position.x = Math.cos(angle) * r;
                    node.group.position.z = Math.sin(angle) * r;
                    node.group.position.y = node.originalPos.y + Math.sin(time + i) * 0.05;
                } else if (mode === 'matrix') {
                    node.group.position.x = (i - 1) * 0.5;
                    node.group.position.z = 0;
                    node.group.position.y = Math.sin(time + i) * 0.2;
                }
                
                node.torus.rotation.z += 0.05;
            });

            // Update Lines
            const points = nodes.map(n => n.group.position);
            points.push(nodes[0].group.position); // Close loop
            line.geometry.setFromPoints(points);

            renderer.render(scene, camera);
        }

        // --- NLP & Controls ---
        const history = document.getElementById('chat-history');
        const input = document.getElementById('chat-input');
        const send = document.getElementById('chat-send');

        async function queryTopos(text) {
            history.innerHTML += `<div style="color:#0f0; margin-top:5px;">USER > ${text}</div>`;
            try {
                // Using relative path to trigger the Express proxy (/v1) in server.js
                const response = await fetch('/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "glm-z1-9b-0414", // Using identified active model
                        messages: [
                            { role: "system", content: "You are UTAI, an n-hyperbolic Topos AI. Respond using §-LANG slang and geometric precision." },
                            { role: "user", content: text }
                        ]
                    })
                });
                const data = await response.json();
                const reply = data.choices[0].message.content;
                history.innerHTML += `<div style="color:#fff; margin-top:5px;">UTAI > ${reply}</div>`;
                history.scrollTop = history.scrollHeight;
                
                // If it looks like a coordinate request, add a node
                if (text.toLowerCase().includes("node") || text.toLowerCase().includes("dimension")) {
                    const randomPos = [Math.random()-0.5, Math.random()-0.5, Math.random()-0.5];
                    createNode(randomPos, 0xffffff, "Dynamic_Tendril");
                }

            } catch (e) {
                history.innerHTML += `<div style="color:#f00; margin-top:5px;">ERR > QHC Connection Failed.</div>`;
            }
        }

        send.onclick = () => { if(input.value) { queryTopos(input.value); input.value = ''; } };
        input.onkeypress = (e) => { if(e.key === 'Enter') send.onclick(); };

        document.getElementById('rho-btn').onclick = () => {
            nodes.forEach(n => { n.group.position.multiplyScalar(-1); n.originalPos.multiplyScalar(-1); });
            history.innerHTML += `<div style="color:#0ff;">SYSTEM > Möbius ρ symmetry applied.</div>`;
        };

        document.getElementById('mode-select').onchange = (e) => { mode = e.target.value; };
        document.getElementById('speed-slider').oninput = (e) => { flowSpeed = parseFloat(e.target.value); };
        document.getElementById('reset-btn').onclick = () => { location.reload(); };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
